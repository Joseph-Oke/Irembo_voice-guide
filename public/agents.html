<header class="navbar">

    <h2>Irembo Agents</h2>

      <label>Name<input id="a-name"></label>

      <button id="a-add">Add agent</button>

    <div class="table-wrap"><table id="esc-table"><thead><tr><th>When</th><th>Agent sent</th><th>Status</th><th></th></tr></thead><tbody></tbody></table></div>
